<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="s4" data-width="1920" data-height="1080"></div>
      <script>
        (function () {
          // SCÈNE 4 — ÉTAPE 2, LE CARAMEL. 15 cm d'étirement : validé (voyant ambre),
          // puis trop court (voyant bordeaux vif). Gag : le raté part dans « MENSONGES ».
          const M = window.MORDU;
          const B = M.T().scenes.s4.beats;
          const root = document.querySelector('[data-composition-id="s4"]');
          const S = M.stage(root);
          const F = M.factory(S.iso, { id: "s4" });
          const s4 = F.s4;
          const tl = gsap.timeline({ paused: true });

          // ---- raccord : fin de la scène 3 (tampons posés, écran allumé).
          gsap.set(F.screenText, { visibility: "visible" });
          F.screen.face.style.background = "var(--choco)";
          F.s3.nuts.forEach(function (n) { gsap.set(n.mark, { scale: 1 }); });
          gsap.set(F.s3.items, { x: 304 });

          // ---- caméra.
          tl.fromTo(S.cam, { ...M.CAM.s3 }, { ...M.CAM.s4, duration: 1.0, ease: "power3.inOut" }, 0);

          // ---- badge.
          const badge = M.badge(S.hud, "02", "CARAMEL", "s4-badge");
          tl.fromTo(badge.inner, { yPercent: 110 }, { yPercent: 0, duration: 0.34, ease: "power3.out" }, B.badge);

          const X0 = 80;
          const FULL = 300; // 15 cm sur la règle

          // ---- étirement 1 : atteint la marque → voyant ambre.
          const d1 = B.valid - B.pull1;
          tl.fromTo(s4.pincer, { x: X0 }, { x: X0 + FULL, duration: d1, ease: "power2.inOut" }, B.pull1);
          tl.fromTo(s4.fil, { scaleX: 0.001, scaleY: 1 }, { scaleX: 1, scaleY: 0.55, duration: d1, ease: "power2.inOut" }, B.pull1);
          tl.set(s4.bulb, { "--base": "var(--caramel-vif)" }, B.valid);
          // Coupe nette et retour au départ.
          tl.to(s4.fil, { scaleX: 0.001, duration: 0.14, ease: "power3.in" }, B.pull2 - 0.42);
          tl.to(s4.pincer, { x: X0, duration: 0.3, ease: "power3.inOut" }, B.pull2 - 0.36);
          tl.set(s4.bulb, { "--base": "var(--choco)" }, B.pull2 - 0.1);

          // ---- étirement 2 : trop court, le fil casse → voyant bordeaux vif.
          const SHORT = 170;
          const d2 = B.fail - B.pull2;
          tl.to(s4.pincer, { x: X0 + SHORT, duration: d2, ease: "power2.out" }, B.pull2);
          tl.fromTo(s4.fil, { scaleX: 0.001, scaleY: 1 }, { scaleX: SHORT / FULL, scaleY: 0.8, duration: d2, ease: "power2.out" }, B.pull2);
          tl.to(s4.fil, { scaleX: 0.001, duration: 0.1, ease: "power2.in" }, B.fail);
          tl.set(s4.bulb, { "--base": "var(--rouge-vif)" }, B.fail);
          // Le caramel raté reste au bout de la pince : une boule.
          tl.fromTo(s4.blob, { scale: 0, x: X0 + SHORT + 20, y: 76, z: 82 }, { scale: 1, duration: 0.12, ease: "power2.out" }, B.fail);
          tl.to(s4.pincer, { x: X0, duration: 0.4, ease: "power3.inOut" }, B.fail + 0.5);

          // ---- gag : la pince donne une pichenette, la boule file dans « MENSONGES ».
          const dT = B.binLand - B.toss;
          tl.to(s4.blob, { x: 475, y: 265, duration: dT, ease: "none" }, B.toss);
          tl.to(s4.blob, { z: 330, duration: dT * 0.45, ease: "power2.out" }, B.toss);
          tl.to(s4.blob, { z: 70, duration: dT * 0.55, ease: "power2.in" }, B.toss + dT * 0.45);
          tl.to(s4.blob, { scale: 0, duration: 0.06, ease: "none" }, B.binLand);

          window.__timelines["s4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
