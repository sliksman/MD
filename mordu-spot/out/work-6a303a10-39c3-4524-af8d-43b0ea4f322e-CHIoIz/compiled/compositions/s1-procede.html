<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="s1" data-width="1920" data-height="1080"></div>
      <script>
        (function () {
          // SCÈNE 1 — LE PROCÉDÉ ORDINAIRE. Malaxer, presser, sécher → « = UN MUR. »
          // Gag : le nuage de la presse recouvre l'ouvrier témoin, qui en ressort gris.
          const M = window.MORDU;
          const B = M.T().scenes.s1.beats;
          const root = document.querySelector('[data-composition-id="s1"]');
          const S = M.stage(root, { gris: true });
          const W = M.chantier(S.iso, { id: "s1" });
          const tl = gsap.timeline({ paused: true });

          // Témoin poudré : même modèle, entièrement gris, caché jusqu'au nuage.
          const dusty = M.operator(S.iso, { x: 60, y: 540, variant: "worker", paint: "gris", id: "s1-dusty" });
          gsap.set(dusty, { visibility: "hidden" });

          // ---- caméra : glisse du chantier vers chaque machine, puis recule.
          tl.fromTo(S.cam, { ...M.CAM.s0 }, { ...M.CAM.mixer, duration: 0.9, ease: "power3.inOut" }, B.glide);
          tl.to(S.cam, { ...M.CAM.press, duration: 0.5, ease: "power3.inOut" }, B.press - 0.45);
          tl.to(S.cam, { ...M.CAM.rack, duration: 0.5, ease: "power3.inOut" }, B.dry - 0.3);
          tl.to(S.cam, { ...M.CAM.s1end, duration: 0.8, ease: "power3.inOut" }, B.wall - 1.3);

          // ---- labels : un seul à la fois, « = UN MUR. » reste.
          const L1 = M.hudLabel(S.hud, "MÉLANGER.", { id: "s1-l1", band: true });
          const L2 = M.hudLabel(S.hud, "PRESSER.", { id: "s1-l2", band: true });
          const L3 = M.hudLabel(S.hud, "SÉCHER.", { id: "s1-l3", band: true });
          const L4 = M.hudLabel(S.hud, "= UN MUR.", { id: "s1-l4", size: 190, band: true });
          M.labelIn(tl, L1, B.mix);
          M.labelOut(tl, L1, B.press - 0.22);
          M.labelIn(tl, L2, B.press);
          M.labelOut(tl, L2, B.dry - 0.22);
          M.labelIn(tl, L3, B.dry);
          M.labelOut(tl, L3, B.wall - 0.24);
          tl.fromTo(L4.inner, { yPercent: 110 }, { yPercent: 0, duration: 0.18, ease: "power4.out" }, B.wall);

          // ---- malaxer : le sac monte, bascule, la poudre tombe, la pale tourne.
          tl.to(W.sack, { x: -110, y: 300, z: 230, duration: 0.5, ease: "power3.out" }, B.mix);
          W.powder.forEach(function (p, i) {
            const t = B.powder + i * 0.05;
            tl.fromTo(p, { scale: 0, z: 250 }, { scale: 1, duration: 0.05, ease: "none" }, t);
            tl.to(p, { z: 118, x: "+=" + p.dx * 0.3, duration: 0.42, ease: "power2.in" }, t);
            tl.to(p, { scale: 0, duration: 0.06, ease: "none" }, t + 0.42);
          });
          tl.to(W.sack, { z: 0, x: -230, y: 320, duration: 0.4, ease: "power3.inOut" }, B.press - 0.4);
          tl.fromTo(W.paddle, { rotationZ: 0 }, { rotationZ: 540, duration: B.press - B.mix, ease: "none" }, B.mix);

          // ---- presser : coup sec, la galette s'écrase, la presse remonte.
          tl.fromTo(W.ram, { z: 200 }, { z: 100, duration: 0.2, ease: "power3.in" }, B.pressHit - 0.2);
          tl.to(W.ram, { z: 67, duration: 0.08, ease: "power2.out" }, B.pressHit);
          M.tweenZ(tl, W.cakeZ, 1, 0.45, 0.08, "power2.out", B.pressHit);
          tl.to(W.ram, { z: 200, duration: 0.45, ease: "power2.inOut" }, B.pressHit + 0.6);

          // ---- gag : nuage de poussière cubique sur le témoin.
          const r = M.rng(13);
          const puffs = [];
          for (let i = 0; i < 16; i++) {
            const a = (i / 16) * Math.PI * 2;
            const rad = 30 + r() * 60;
            const sz = 44 + r() * 46;
            const p = M.obj(S.iso, { x: 60 + Math.cos(a) * rad - sz / 2, y: 540 + Math.sin(a) * rad - sz / 2, z: 20 + r() * 220 });
            M.cuboid(p, { w: sz, d: sz, h: sz, mat: "creme" });
            gsap.set(p, { scale: 0 });
            puffs.push(p);
          }
          puffs.forEach(function (p, i) {
            tl.to(p, { scale: 1, duration: 0.22, ease: "power2.out" }, B.dust + i * 0.012);
            tl.to(p, { scale: 0, duration: 0.3, ease: "power2.in" }, B.dust + 1.1 + i * 0.03);
          });
          tl.set(W.witness, { visibility: "hidden" }, B.dust + 0.25);
          tl.set(dusty, { visibility: "visible" }, B.dust + 0.25);

          // ---- sécher : les galettes glissent sur la claie.
          W.trays.forEach(function (t, i) {
            tl.set(t, { visibility: "hidden" }, 0);
            tl.set(t, { visibility: "visible" }, B.dry + 0.15 + i * 0.22);
            const z0 = [46, 126, 206][i];
            tl.fromTo(t, { z: z0 + 520 }, { z: z0, duration: 0.34, ease: "power3.in" }, B.dry + 0.15 + i * 0.22);
          });

          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
