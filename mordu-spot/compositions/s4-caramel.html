<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="s4" data-width="1920" data-height="1080"></div>
      <script>
        (function () {
          // SCÈNE 4 — ÉTAPE 2, LE CARAMEL. 15 cm d'étirement : validé (voyant ambre),
          // puis trop court (voyant bordeaux vif). Gag : le raté part dans « MENSONGES ».
          const M = window.MORDU;
          const B = M.T().scenes.s4.beats;
          const root = document.querySelector('[data-composition-id="s4"]');
          const S = M.stage(root);
          const F = M.factory(S.iso, { id: "s4" });
          const s4 = F.s4;
          const tl = gsap.timeline({ paused: true });

          // ---- raccord : fin de la scène 3 (tampons posés, écran allumé).
          gsap.set(F.screenText, { visibility: "inherit" });
          F.screen.face.style.background = "var(--choco)";
          F.s3.nuts.forEach(function (n) { gsap.set(n.mark, { scale: 1 }); });
          gsap.set(F.s3.items, { x: 304 });

          // ---- caméra.
          tl.fromTo(S.cam, { ...M.CAM.s3 }, { ...M.CAM.s4, duration: 1.0, ease: "power3.inOut" }, 0);

          // ---- badge.
          const badge = M.badge(S.hud, "02", "CARAMEL", "s4-badge");
          tl.fromTo(badge.inner, { yPercent: 110 }, { yPercent: 0, duration: 0.34, ease: "power3.out" }, B.badge);

          const X0 = 124;     // pince mobile au repos (la boule est entre les mâchoires)
          const FULL = 254;   // la pince atteint la marque « 15 cm » (x 378)
          const SHORT = 110;  // essai raté : casse bien avant la marque
          const FIL = 288;    // longueur du fil à scaleX 1

          // ---- essai 1 : la boule s'étire en fil jusqu'à la marque → voyant ambre.
          const d1 = B.valid - B.pull1;
          tl.fromTo(s4.pincer, { x: X0 }, { x: X0 + FULL, duration: d1, ease: "power2.inOut" }, B.pull1);
          tl.fromTo(s4.fil, { scaleX: 0.001, scaleY: 1 }, { scaleX: (X0 + FULL - 102) / FIL, scaleY: 0.55, duration: d1, ease: "power2.inOut" }, B.pull1);
          tl.to(s4.blobL, { scaleX: 0.7, scaleY: 0.8, duration: d1, ease: "power2.inOut" }, B.pull1);
          tl.set(s4.bulb, { "--base": "var(--caramel-vif)" }, B.valid);
          // Validé : le caramel étiré part en production (vers le haut), la pince revient.
          tl.to(s4.fil, { z: 700, duration: 0.24, ease: "power3.in" }, B.valid + 0.06);
          tl.to(s4.blobL, { z: 696, duration: 0.24, ease: "power3.in" }, B.valid + 0.06);
          tl.to(s4.pincer, { x: X0, duration: 0.28, ease: "power3.inOut" }, B.valid + 0.08);
          tl.set(s4.bulb, { "--base": "var(--choco)" }, B.refill);
          // Une nouvelle boule tombe entre les mâchoires.
          tl.set(s4.fil, { scaleX: 0.001, scaleY: 1, z: 74 }, B.refill);
          // immediateRender: false — sinon la boule de départ serait placée en l'air dès le chargement.
          tl.fromTo(s4.blobL, { z: 700, scaleX: 1, scaleY: 1 }, { z: 70, duration: 0.3, ease: "power3.in", immediateRender: false }, B.refill);

          // ---- essai 2 : le fil casse avant la marque → voyant bordeaux vif.
          const d2 = B.fail - B.pull2;
          tl.to(s4.pincer, { x: X0 + SHORT, duration: d2, ease: "power2.out" }, B.pull2);
          tl.fromTo(s4.fil, { scaleX: 0.001, scaleY: 1 }, { scaleX: (X0 + SHORT - 102) / FIL, scaleY: 0.8, duration: d2, ease: "power2.out" }, B.pull2);
          // Rupture : chaque moitié se rétracte en boule à son extrémité.
          tl.to(s4.fil, { scaleX: 0.001, duration: 0.1, ease: "power2.in" }, B.fail);
          tl.fromTo(s4.blobR, { x: X0 + SHORT - 22, scale: 0 }, { scale: 1, duration: 0.1, ease: "power2.out" }, B.fail);
          tl.set(s4.bulb, { "--base": "var(--rouge-vif)" }, B.fail);
          // La pince revient, la moitié ratée avec elle.
          tl.to(s4.pincer, { x: X0 + 60, duration: 0.35, ease: "power3.inOut" }, B.fail + 0.5);
          tl.to(s4.blobR, { x: X0 + 60 - 22, duration: 0.35, ease: "power3.inOut" }, B.fail + 0.5);

          // ---- gag : pichenette, la moitié ratée file dans « MENSONGES ».
          const dT = B.binLand - B.toss;
          tl.to(s4.pincer, { x: X0 + 80, duration: 0.08, ease: "power3.out" }, B.toss - 0.04);
          tl.to(s4.blobR, { x: 520, y: 237, duration: dT, ease: "none" }, B.toss);
          tl.to(s4.blobR, { z: 330, duration: dT * 0.45, ease: "power2.out" }, B.toss);
          tl.to(s4.blobR, { z: 70, duration: dT * 0.55, ease: "power2.in" }, B.toss + dT * 0.45);
          tl.set(s4.blobR, { scale: 0 }, B.binLand);
          tl.to(s4.pincer, { x: X0, duration: 0.3, ease: "power3.inOut" }, B.toss + 0.3);

          // ---- l'interface sort par bloc avant le raccord (jamais de disparition sèche).
          const OUT = M.T().scenes.s4.dur - 0.32;
          tl.to([badge.inner], { yPercent: -110, duration: 0.22, ease: "power2.in" }, OUT);

          window.__timelines["s4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
