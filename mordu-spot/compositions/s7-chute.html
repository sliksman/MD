<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="s7" data-width="1920" data-height="1080"></div>
      <script>
        (function () {
          // SCÈNE 7 — LA CHUTE. Tout est balayé d'un revers, sauf une barre MORDU
          // au centre de la dalle, qui devient plein cadre. Logo MORDU. Un seul croc : la moitié.
          const M = window.MORDU;
          const B = M.T().scenes.s7.beats;
          const root = document.querySelector('[data-composition-id="s7"]');
          const S = M.stage(root);
          const F = M.factory(S.iso, { id: "s7" });
          const tl = gsap.timeline({ paused: true });

          // ---- raccord : fin des scènes 3 à 6.
          gsap.set(F.screenText, { visibility: "inherit" });
          F.screen.face.style.background = "var(--choco)";
          F.s3.nuts.forEach(function (n) { gsap.set(n.mark, { scale: 1 }); });
          gsap.set(F.s3.items, { x: 304 });
          gsap.set(F.s4.bulb, { "--base": "var(--rouge-vif)" });
          M.setZ(F.s5.curtainZ, 1);
          F.s5.cross.forEach(function (c) { gsap.set(c, { scaleX: 1 }); });
          const sh = F.s5.shiny;
          gsap.set(sh, { y: -150, z: -75, x: sh.x0 - 40 * (7 - 5.3) });
          gsap.set(F.s5.items, { x: 40 * 6.4 });
          F.s5.bars.forEach(function (g) {
            gsap.set(g.bare, { visibility: "hidden" });
            gsap.set(g.coated, { visibility: "inherit" });
          });
          F.s6.doors.forEach(function (d) { gsap.set(d.wedge, { scale: 1 }); });
          gsap.set(F.s6.doors[12].panel, { rotationZ: -75 });
          gsap.set(F.s6.draftSign, { scale: 1 });
          gsap.set(F.s6.placo, { visibility: "hidden" });
          gsap.set(F.s6.mordu, { visibility: "inherit" });
          gsap.set(F.s6.testBar, { visibility: "inherit", x: 162, z: 60 });
          gsap.set(F.s6.nail, { visibility: "inherit", x: 208, y: 56, z: 70, rotationY: 0 });
          gsap.set(F.s6.hammer, { z: 230 });

          // ---- la barre héroïne : coupe visible, en deux moitiés pour le croc.
          const L = 320, D = 96, H = 70, HALF = L / 2;
          const hero = M.obj(S.iso, { x: -L / 2, y: -D / 2, id: "s7-hero" });
          M.shadow(hero, { w: L, d: D, ext: 30 });
          const heroBody = M.obj(hero, {});
          const main = M.barMordu(heroBody, { len: HALF, d: D, h: H, cut: true, shadow: false, seed: 5 });
          // Trace du croc : bord dentelé sur la coupe.
          const biteFace = M.decal(main.body.faces.e, '<svg viewBox="0 0 ' + D + " " + H + '" preserveAspectRatio="none"><path d="M0 0 H' + D + ' V12 Q' + D * 0.86 + ' 26 ' + D * 0.72 + ' 12 Q' + D * 0.58 + ' 28 ' + D * 0.44 + ' 12 Q' + D * 0.3 + ' 26 ' + D * 0.16 + ' 12 Q' + D * 0.08 + ' 22 0 14 Z" fill="var(--choco)"/></svg>');
          gsap.set(biteFace, { visibility: "hidden" });
          const chunk = M.barMordu(heroBody, { x: HALF, len: HALF, d: D, h: H, shadow: false, seed: 6 });
          gsap.set(hero, { visibility: "hidden" });

          // ---- caméra : recul plein décor, puis plein cadre sur la barre.
          tl.fromTo(S.cam, { ...M.CAM.s6 }, { ...M.CAM.factory, duration: 0.4, ease: "power3.out" }, 0);
          const hero1 = M.focus({ x: 0, y: 0, z: 30 }, 1.8, 0, 190);
          tl.to(S.cam, { ...hero1, duration: 0.6, ease: "power3.inOut" }, B.hero + 0.1);

          // ---- le revers : tout file vers la gauche de l'écran et sort du cadre.
          // Déplacement (−x, +y) = horizontal à l'écran ; masqué seulement une fois sorti.
          const SW = 2700, SWD = 0.5;
          const swept = [F.wordmark, F.console, F.s4, F.s3, F.s6, F.s5]; // le wordmark part en premier
          swept.forEach(function (g, i) {
            const x0 = gsap.getProperty(g, "x"), y0 = gsap.getProperty(g, "y");
            const t = B.sweep + i * 0.035;
            tl.fromTo(g, { x: x0, y: y0 }, { x: x0 - SW, y: y0 + SW, duration: SWD, ease: "power3.in" }, t);
            tl.set(g, { visibility: "hidden" }, t + SWD);
          });

          // ---- la barre se pose au centre, une fois la dalle vide.
          tl.set(hero, { visibility: "inherit" }, B.hero);
          tl.fromTo(heroBody, { z: 900 }, { z: 0, duration: 0.3, ease: "power3.in" }, B.hero);

          // ---- logo MORDU (charte : bordeaux sur crème), sur « MORDU. ».
          const logo = document.createElement("div");
          logo.className = "end-logo";
          logo.id = "s7-logo";
          const lsp = document.createElement("span");
          lsp.className = "t-display";
          lsp.textContent = "MORDU";
          logo.appendChild(lsp);
          S.hud.appendChild(logo);
          gsap.set(lsp, { yPercent: 110 });
          // Le logo entre une fois le wordmark 3D sorti du cadre (jamais deux MORDU superposés).
          tl.fromTo(lsp, { yPercent: 110 }, { yPercent: 0, duration: 0.3, ease: "power3.out" }, B.sweep + SWD);

          // ---- titre sur une ligne, en deux temps.
          const title = document.createElement("div");
          title.className = "end-title";
          title.id = "s7-title";
          const t1 = document.createElement("span");
          t1.className = "t-display";
          t1.textContent = "ENFIN UNE BARRE.";
          const t2 = document.createElement("span");
          t2.className = "t-display";
          t2.textContent = "PAS UNE BRIQUE.";
          title.appendChild(t1);
          title.appendChild(t2);
          S.hud.appendChild(title);
          gsap.set([t1, t2], { yPercent: 110 });
          tl.fromTo(t1, { yPercent: 110 }, { yPercent: 0, duration: 0.3, ease: "power3.out" }, B.title);
          tl.fromTo(t2, { yPercent: 110 }, { yPercent: 0, duration: 0.3, ease: "power3.out" }, B.title2);

          const small = document.createElement("div");
          small.className = "end-small";
          small.id = "s7-small";
          const ssp = document.createElement("span");
          ssp.className = "t-text";
          ssp.textContent = "20 G DE PROTÉINES · CARAMEL CACAHUÈTE";
          small.appendChild(ssp);
          S.hud.appendChild(small);
          gsap.set(ssp, { yPercent: 110 });
          tl.fromTo(ssp, { yPercent: 110 }, { yPercent: 0, duration: 0.3, ease: "power3.out" }, B.small - 0.6);

          const legalWrap = document.createElement("div");
          legalWrap.className = "end-legal";
          legalWrap.id = "s7-legal";
          const legal = document.createElement("span");
          legal.textContent = "Marque fictive. Projet personnel.";
          legalWrap.appendChild(legal);
          S.hud.appendChild(legalWrap);
          gsap.set(legal, { yPercent: 110 });
          tl.fromTo(legal, { yPercent: 110 }, { yPercent: 0, duration: 0.3, ease: "power3.out" }, B.small - 0.6);

          // ---- un seul croc, sec : la moitié de la barre disparaît.
          tl.set(chunk, { visibility: "hidden" }, B.bite);
          tl.set(biteFace, { visibility: "inherit" }, B.bite);

          window.__timelines["s7"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
