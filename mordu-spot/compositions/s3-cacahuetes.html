<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="s3" data-width="1920" data-height="1080"></div>
      <script>
        (function () {
          // SCÈNE 3 — ÉTAPE 1, LES CACAHUÈTES. Convoyeur pas à pas, tampon OK / REFUSÉE.
          // Gag : après avoir refusé, l'opérateur regarde la caméra, même visage fermé.
          const M = window.MORDU;
          const B = M.T().scenes.s3.beats;
          const root = document.querySelector('[data-composition-id="s3"]');
          const S = M.stage(root);
          const F = M.factory(S.iso, { id: "s3" });
          const s3 = F.s3;
          const tl = gsap.timeline({ paused: true });

          // ---- raccord : état de fin de la scène 2.
          gsap.set(F.screenText, { visibility: "inherit" });
          F.screen.face.style.background = "var(--choco)";

          // ---- caméra : glisse de la console au poste de tri.
          tl.fromTo(S.cam, { ...M.CAM.console }, { ...M.CAM.s3, duration: 0.9, ease: "power3.inOut" }, 0);

          // ---- badge.
          const badge = M.badge(S.hud, "01", "CACAHUÈTES", "s3-badge");
          tl.fromTo(badge.inner, { yPercent: 110 }, { yPercent: 0, duration: 0.34, ease: "power3.out" }, B.badge);

          // ---- convoyeur : avance d'un pas (76) avant chaque frappe, puis s'arrête net.
          const STEP = 76;
          const hits = [B.ok1, B.ok2, B.refuse, B.ok3];
          hits.forEach(function (t, k) {
            const t0 = Math.max(B.belt, t - 0.62);
            tl.to(s3.items, { x: STEP * (k + 1), duration: 0.34, ease: "power3.inOut" }, t0);
            tl.to(s3.conveyor.stripes, {
              x: STEP * (k + 1),
              duration: 0.34,
              ease: "power3.inOut",
              modifiers: { x: (v) => ((parseFloat(v) % 30) - 30) + "px" },
            }, t0);
          });
          gsap.set(s3.conveyor.stripes, { x: -30 });

          // ---- frappes : le bras descend, le tampon frappe à plat, l'empreinte apparaît.
          hits.forEach(function (t, k) {
            tl.to(s3.arm, { rotationX: 80, duration: 0.12, ease: "power3.in" }, t - 0.12);
            tl.to(s3.grip, { rotationX: -80, duration: 0.12, ease: "power3.in" }, t - 0.12);
            tl.set(s3.nuts[k].mark, { scale: 1 }, t);
            tl.to(s3.arm, { rotationX: 100, duration: 0.28, ease: "power2.out" }, t + 0.1);
            tl.to(s3.grip, { rotationX: -100, duration: 0.28, ease: "power2.out" }, t + 0.1);
          });

          // ---- gag : regard caméra, impassible, puis retour au travail.
          tl.to(s3.op.parts.head, { rotationZ: -42, duration: 0.22, ease: "power3.out" }, B.glance);
          tl.to(s3.op.parts.head, { rotationZ: 0, duration: 0.22, ease: "power3.inOut" }, B.glance + 0.85);

          window.__timelines["s3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
