<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="s6" data-width="1920" data-height="1080"></div>
      <script>
        (function () {
          // SCÈNE 6 — ÉTAPE 4, LE TEST DU CLOU. Sur les barres grises (dures), le clou se
          // tord : elles partent caler des portes (compteur 13 / 14). Sur la MORDU
          // (moelleuse), le clou s'enfonce sans résistance : elle reste sur l'établi.
          // Gag : la dernière porte calée reste ouverte, panneau « COURANT D'AIR ».
          const M = window.MORDU;
          const B = M.T().scenes.s6.beats;
          const root = document.querySelector('[data-composition-id="s6"]');
          const S = M.stage(root);
          const F = M.factory(S.iso, { id: "s6" });
          const s6 = F.s6;
          const tl = gsap.timeline({ paused: true });

          // ---- raccord : fin des scènes 3 à 5.
          gsap.set(F.screenText, { visibility: "inherit" });
          F.screen.face.style.background = "var(--choco)";
          F.s3.nuts.forEach(function (n) { gsap.set(n.mark, { scale: 1 }); });
          gsap.set(F.s3.items, { x: 304 });
          gsap.set(F.s4.bulb, { "--base": "var(--rouge-vif)" });
          M.setZ(F.s5.curtainZ, 1);
          F.s5.cross.forEach(function (c) { gsap.set(c, { scaleX: 1 }); });
          const sh = F.s5.shiny;
          gsap.set(sh, { y: -150, z: -75, x: sh.x0 - 40 * (7 - 5.3) });
          gsap.set(F.s5.items, { x: 40 * 6.4 });
          F.s5.bars.forEach(function (g) {
            gsap.set(g.bare, { visibility: "hidden" });
            gsap.set(g.coated, { visibility: "inherit" });
          });

          // ---- caméra.
          tl.fromTo(S.cam, { ...M.CAM.s5 }, { ...M.CAM.s6, duration: 1.0, ease: "power3.inOut" }, 0);
          const bench = M.focus({ x: 380, y: 250, z: 110 }, 1.7, 0, 0);
          // Plan serré sur l'établi pour chaque test lisible, plan large pour les portes.
          tl.to(S.cam, { ...bench, duration: 0.45, ease: "power3.inOut" }, B.nail1 - 1.6);
          tl.to(S.cam, { ...M.CAM.s6, duration: 0.5, ease: "power3.inOut" }, B.wedge1 - 0.65);
          tl.to(S.cam, { ...bench, duration: 0.35, ease: "power3.inOut" }, B.sink - 0.95);
          // Fin : serré sur la porte restée ouverte, on laisse le temps de lire le panneau.
          tl.to(S.cam, { ...M.CAM.s6end, duration: 0.7, ease: "power3.inOut" }, B.draft - 0.9);

          // ---- badge + compteur.
          const badge = M.badge(S.hud, "04", "TEST DU CLOU", "s6-badge");
          tl.fromTo(badge.inner, { yPercent: 110 }, { yPercent: 0, duration: 0.34, ease: "power3.out" }, B.badge);
          const counter = document.createElement("div");
          counter.className = "counter";
          counter.id = "s6-counter";
          const cin = document.createElement("div");
          cin.className = "counter-inner";
          const digits = document.createElement("div");
          digits.className = "digits";
          const nums = [];
          for (let i = 0; i <= 13; i++) {
            const sp = document.createElement("span");
            sp.className = "t-display";
            sp.textContent = String(i);
            digits.appendChild(sp);
            nums.push(sp);
          }
          const of = document.createElement("span");
          of.className = "t-display of";
          of.textContent = "/ 14";
          cin.appendChild(digits);
          cin.appendChild(of);
          counter.appendChild(cin);
          S.hud.appendChild(counter);
          gsap.set(cin, { yPercent: 110 });
          gsap.set(nums[0], { visibility: "inherit" });
          tl.fromTo(cin, { yPercent: 110 }, { yPercent: 0, duration: 0.34, ease: "power3.out" }, B.badge + 0.15);
          function setCount(n, t) {
            tl.set(nums[n - 1], { visibility: "hidden" }, t);
            tl.set(nums[n], { visibility: "inherit" }, t);
          }

          // ---- cloueur : le clou est chargé sous la tête du marteau et descend avec lui.
          // Barre posée : dessus z 82. Marteau levé z 230 ↔ clou z 172 ;
          // contact : marteau 140 ↔ clou 82 (pointe sur le dessus de la barre).
          const BAR = s6.BAR;
          const TOP = 60 + BAR.h;
          const BX = 182, BY = 43; // barre centrée sous le marteau
          function strike(t, d) {
            tl.to(s6.hammer, { z: TOP + 58, duration: d, ease: "power3.in" }, t - d);
            tl.to(s6.nail, { z: TOP, duration: d, ease: "power3.in" }, t - d);
          }
          function hammerUp(t, d) {
            tl.to(s6.hammer, { z: 230, duration: d, ease: "power2.out" }, t);
          }
          // Une barre tombe sur la partie gauche de l'établi (hors de l'axe du marteau),
          // puis glisse sous le marteau. Fin à t + 0.5.
          function dropBar(t, mordu) {
            tl.set(s6.placo, { visibility: mordu ? "hidden" : "inherit" }, t);
            tl.set(s6.mordu, { visibility: mordu ? "inherit" : "hidden" }, t);
            tl.set(s6.testBar, { visibility: "inherit", x: 40, y: BY }, t);
            tl.fromTo(s6.testBar, { z: 700 }, { z: 60, duration: 0.3, ease: "power3.in", immediateRender: false }, t);
            tl.fromTo(s6.testBar, { x: 40 }, { x: BX, duration: 0.2, ease: "power3.inOut", immediateRender: false }, t + 0.3);
          }
          // Un clou sort de la tête du marteau (chargement). Fin à t + 0.12.
          function placeNail(t) {
            tl.set(s6.nail, { visibility: "inherit", x: 208, y: 56, rotationY: 0 }, t);
            tl.fromTo(s6.nail, { z: 212 }, { z: 172, duration: 0.12, ease: "power2.out" }, t);
          }

          // ---- barre 1 (grise) : le clou se tord, la barre est expédiée par-dessus les
          // portes et se pose, telle quelle, au pied de la porte 4 : même objet, même taille.
          dropBar(B.nail1 - 1.3, false);
          placeNail(B.nail1 - 0.6);
          strike(B.nail1, 0.12);
          tl.to(s6.nail, { rotationY: 78, duration: 0.08, ease: "power3.out" }, B.nail1);
          hammerUp(B.nail1 + 0.06, 0.25);
          tl.to(s6.nail, { y: -40, z: 0, rotationY: 90, duration: 0.3, ease: "power2.in" }, B.nail1 + 0.45);
          tl.set(s6.nail, { visibility: "hidden" }, B.nail1 + 0.75);
          // Porte 4 (index 3) : pile en face de l'établi. Cale en (560+14, -120+3*46+6) = (574, 24).
          const W0 = s6.doors[3];
          const WX = 574, WY = 24, dTo = 0.55;
          // Le déplacement horizontal finit avant la chute : la barre passe au-dessus des
          // portes (h 98) puis descend à la verticale sur sa place.
          tl.to(s6.testBar, { x: WX, y: WY, duration: dTo * 0.7, ease: "power1.out" }, B.wedge1 - dTo);
          tl.to(s6.testBar, { z: 260, duration: dTo * 0.4, ease: "power2.out" }, B.wedge1 - dTo);
          tl.to(s6.testBar, { z: 0, duration: dTo * 0.6, ease: "power2.in" }, B.wedge1 - dTo * 0.6);
          // Arrivée : la barre devient la cale (géométrie identique, aucune variation de taille).
          tl.set(s6.testBar, { visibility: "hidden" }, B.wedge1);
          tl.set(W0.wedge, { scale: 1 }, B.wedge1);
          setCount(1, B.wedge1);

          // ---- rafale : 12 barres dures, 12 clous tordus, 12 portes calées.
          const CYC = 0.09;
          tl.set(s6.testBar, { x: BX, y: BY, z: 60, visibility: "inherit" }, B.rush - 0.2);
          const order = [0, 1, 2, 4, 5, 6, 7, 8, 9, 10, 11, 12]; // la porte 4 est déjà calée
          order.forEach(function (di, j) {
            const k = j + 1;
            const t = B.rush + j * CYC;
            tl.to(s6.hammer, { z: TOP + 58, duration: CYC * 0.45, ease: "power3.in" }, t);
            tl.to(s6.hammer, { z: 230, duration: CYC * 0.45, ease: "power2.out" }, t + CYC * 0.5);
            tl.fromTo(s6.testBar, { x: BX - 42 }, { x: BX, duration: CYC * 0.3, ease: "none", immediateRender: false }, t);
            // Chaque cale tombe d'en haut à sa place, même taille que la barre de l'établi.
            tl.set(s6.doors[di].wedge, { scale: 1 }, t + CYC * 0.2);
            tl.fromTo(s6.doors[di].wedge, { z: 260 }, { z: 0, duration: CYC * 0.8, ease: "power2.in", immediateRender: false }, t + CYC * 0.2);
            setCount(k + 1, t + CYC);
          });
          tl.set(s6.testBar, { visibility: "hidden" }, B.rush + 11 * CYC + CYC * 0.5);
          // La 13e porte calée reste ouverte.
          const lastDoor = s6.doors[12];
          tl.to(lastDoor.panel, { rotationZ: -75, duration: 0.2, ease: "power3.out" }, B.rush + 11 * CYC + 0.08);

          // ---- la MORDU : le clou s'enfonce sans résistance. Elle reste sur l'établi.
          dropBar(B.sink - 0.66, true);
          placeNail(B.sink - 0.4);
          strike(B.sink, 0.14);
          tl.to(s6.hammer, { z: 122, duration: 0.3, ease: "power2.out" }, B.sink);
          tl.to(s6.nail, { z: 64, duration: 0.3, ease: "power2.out" }, B.sink);
          hammerUp(B.sink + 0.55, 0.35);

          // ---- gag : panneau « COURANT D'AIR ».
          tl.fromTo(s6.draftSign, { scale: 0 }, { scale: 1, duration: 0.18, ease: "power3.out" }, B.draft);
          // Le courant d'air fait battre la porte (souple, sans rebond), et elle revient à -75.
          tl.to(lastDoor.panel, { rotationZ: -88, duration: 0.55, ease: "sine.inOut" }, B.draft + 0.4);
          tl.to(lastDoor.panel, { rotationZ: -66, duration: 0.7, ease: "sine.inOut" }, B.draft + 0.95);
          tl.to(lastDoor.panel, { rotationZ: -75, duration: 0.6, ease: "sine.inOut" }, B.draft + 1.65);

          // ---- l'interface sort par bloc avant le raccord (jamais de disparition sèche).
          const OUT = M.T().scenes.s6.dur - 0.32;
          tl.to([badge.inner, cin], { yPercent: -110, duration: 0.22, ease: "power2.in" }, OUT);

          window.__timelines["s6"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
