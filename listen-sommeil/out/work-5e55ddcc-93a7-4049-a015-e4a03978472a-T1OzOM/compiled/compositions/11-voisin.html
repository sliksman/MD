<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="s11" data-width="1080" data-height="1920"></div>
      <script>
        (function () {
          const ID = "s11";
          const L = window.LS;
          const sc = L.scene(ID);
          const A = L.art(ID + "-");
          const root = document.querySelector('[data-composition-id="s11"]');
          const tl = gsap.timeline({ paused: true });
          const w = sc.w;
          // 11 — LE VOISIN. Gros plan sur les paupières qui tombent ; la caméra recule, le mur est coupé : perceuse.
          const drillArcs = [120, 220, 330].map((r, i) => A.dots("d" + i, A.arc(700, 800, r, 140 + i * 5, 220 - i * 5), { step: 24, r: 7 })).join("");
          const world = A.bg() + A.wallCut() + drillArcs + A.pill("pBrr", 800, 340, "BRRRRR", 700, 798);
          // gros plan sur la tête (160,845) : échelle 2.2 autour de 540,960
          const Z = 2.2, zx = (540 - 160) * Z, zy = (960 - 845) * Z;
          const hud = A.pill("pAlmost", 540, 560, "presque…", 540, 700);
          const S = L.stage(root, ID, world, hud);
          L.fadeIn(tl, S, sc);
          gsap.set(S.cam, { scale: Z, x: zx, y: zy, svgOrigin: "540 960" });
          tl.to(S.cam, { scale: Z * 1.05, x: zx * 1.05, y: zy * 1.05, duration: 2.6, ease: "none" }, 0);
          // les paupières tombent lentement
          L.initLids(S, 0.3);
          L.lids(tl, S, 0.3, 0.75, w("L29", -1) - 0.3);
          L.pill(tl, S, "pAlmost", w("L29", -1) - 0.2);
          // « fermer les yeux » : fermés
          L.shut(tl, S, w("L30", 4), true);
          tl.to(S.$("pAlmost"), { opacity: 0, duration: 0.3 }, w("L30", 6));
          // recul : on découvre le mur et le voisin
          tl.to(S.cam, { scale: 1, x: 0, y: 0, duration: 1.1, ease: "power2.inOut" }, w("L30", 7) - 0.2);
          // « refaire toute sa cuisine » : perceuse, arcs, yeux grands ouverts
          const re = w("L30", 12);
          tl.fromTo(S.$("drill"), { x: 0 }, { x: 4, duration: 0.04, yoyo: true, repeat: Math.max(0, Math.floor((sc.hostDur - re) / 0.04) - 1), ease: "none" }, re);
          ["d0", "d1", "d2"].forEach((d, i) => {
            L.drawDots(tl, S.$(d), re + i * 0.08, 0.2, { from: "center" });
            const per = 0.5, reps = Math.max(0, Math.floor((sc.hostDur - re - 0.3) / per) - 1);
            tl.fromTo(S.$(d), { scale: 0.9, opacity: 1, svgOrigin: "700 800" }, { scale: 1.15, opacity: 0.35, duration: per, ease: "power1.out", repeat: reps }, re + 0.25 + i * 0.12);
          });
          L.pill(tl, S, "pBrr", re + 0.1);
          tl.fromTo(S.$("pBrr-b"), { rotation: -3, transformOrigin: "50% 50%" }, { rotation: 3, duration: 0.05, yoyo: true, repeat: 15 }, re + 0.5);
          const op = w("L30", 13);
          L.shut(tl, S, op, false);
          L.lids(tl, S, op, 0, 0.08);
          tl.fromTo(S.$("eyes-open"), { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.45, duration: 0.2, ease: "back.out(3)" }, op);
          // petite secousse de caméra
          tl.fromTo(S.cam, { x: 0 }, { x: 6, duration: 0.05, yoyo: true, repeat: 7, ease: "none" }, op);

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
