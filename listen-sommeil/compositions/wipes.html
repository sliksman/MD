<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
        #wipes-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      </style>
      <div id="root" data-composition-id="wipes" data-width="1080" data-height="1920"></div>
      <script>
        (function () {
          // Volet jaune : un panneau ambre à bord biseauté traverse l'écran de gauche à droite.
          // Il couvre l'image au moment de la coupe, puis libère le plan suivant.
          // Instants lus dans timeline.js (timeline.json → "wipes"), toujours dans une respiration de la voix.
          const root = document.querySelector('[data-composition-id="wipes"]');
          root.innerHTML = '<svg id="wipes-svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" data-layout-allow-overflow>' +
            '<polygon id="wipes-panel" points="0,0 1420,0 1080,1920 -340,1920" fill="#F5B85A"/></svg>';
          const panel = root.querySelector("#wipes-panel");
          gsap.set(panel, { x: -1800 });
          const tl = gsap.timeline({ paused: true });
          (window.LS_TIMELINE.wipes || []).forEach(function (t) {
            tl.fromTo(panel, { x: -1800 }, { x: 0, duration: 0.32, ease: "power2.in", immediateRender: false }, t - 0.34);
            tl.fromTo(panel, { x: 0 }, { x: 1550, duration: 0.34, ease: "power2.out", immediateRender: false }, t + 0.04);
            tl.set(panel, { x: -1800 }, t + 0.4);
          });
          window.__timelines["wipes"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
