<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
        #captions-layer .cap {
          position: absolute;
          left: 40px;
          width: 920px;
          text-align: center;
          white-space: nowrap;
          font-family: "Nunito", sans-serif;
          font-weight: 900;
          color: #fff;
          text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6), 0 2px 3px rgba(0, 0, 0, 0.5);
          opacity: 0;
        }
        #captions-layer .cap span { display: inline-block; margin: 0 0.12em; }
        #captions-layer .cap .hl { color: #f5b85a; }
      </style>
      <div data-hf-id="hf-ov84" id="root" data-composition-id="captions" data-width="1080" data-height="1920">
        <div data-hf-id="hf-c8r0" id="captions-layer"></div>
      </div>
      <script>
        (function () {
          // Sous-titres mot à mot, façon Catcharium : 2–3 mots, mots-clés ambre.
          // Timings lus dans timeline.js (générés depuis timeline.json).
          const C = window.LS_TIMELINE.captions;
          const layer = document.getElementById("captions-layer");
          const tl = gsap.timeline({ paused: true });
          if (C.enabled) {
            C.groups.forEach(function (g, i) {
              const txt = g.words.map(function (x) { return x.w; }).join(" ");
              const size = Math.min(80, Math.round(860 / (txt.length * 0.52)));
              const el = document.createElement("div");
              el.className = "cap";
              el.id = "cap-" + i;
              el.style.fontSize = size + "px";
              el.style.top = Math.round(g.y - size * 0.82) + "px";
              el.innerHTML = g.words.map(function (x) {
                return '<span class="' + (x.hl ? "hl" : "") + '">' + window.LS.esc(x.w) + "</span>";
              }).join("");
              layer.appendChild(el);
              const spans = el.querySelectorAll("span");
              tl.fromTo(el, { opacity: 0, scale: 0.94, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.14, ease: "back.out(2)" }, g.start);
              g.words.forEach(function (x, k) {
                tl.fromTo(spans[k], { opacity: 0.0, y: 6 }, { opacity: 1, y: 0, duration: 0.1, ease: "power2.out" }, Math.max(g.start, x.t - 0.02));
              });
              tl.set(el, { opacity: 0 }, g.end);
            });
          }
          window.__timelines["captions"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
