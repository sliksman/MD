<!doctype html>
<!-- GÉNÉRÉ par scripts/sync.mjs depuis src/scenes/13-pluie.js — éditer la source, pas ce fichier. -->
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="s13" data-width="1080" data-height="1920"></div>
      <script>
        (function () {
          const ID = "s13";
          const L = window.LS;
          const sc = L.scene(ID);
          const A = L.art(ID + "-");
          const root = document.querySelector('[data-composition-id="s13"]');
          const tl = gsap.timeline({ paused: true });
          const w = sc.w;
          // 13 — LA PLUIE (plan tenu). Les arcs bleus du téléphone recouvrent ceux de la perceuse ; les yeux se ferment.
          const drillArcs = [120, 220, 330].map((r, i) => A.dots("d" + i, A.arc(700, 800, r, 140 + i * 5, 220 - i * 5), { step: 24, r: 7 })).join("");
          const rainArcs = [140, 250, 370].map((r, i) => A.dots("r" + i, A.arc(572, 912, r, 190 + i * 5, 330 - i * 5), { step: 22, r: 7, color: L.C.rain })).join("");
          const world = A.bg() + A.wallCut() + drillArcs + rainArcs + A.rain("rain", 60, 0, 1080, 100, 1500) +
            A.pill("pRain", 330, 360, "pluie régulière", 572, 905, { dot: L.C.rain });
          const S = L.stage(root, ID, world, "");
          L.fadeIn(tl, S, sc);
          gsap.set(S.$("phone-on"), { opacity: 1 });
          L.initLids(S, 0);
          gsap.set(S.$("eyes-open"), { scale: 1.3, transformOrigin: "50% 50%" });
          tl.to(S.$("eyes-open"), { scale: 1, duration: 0.6 }, 0.3);
          // la perceuse continue mais s'efface sous la pluie
          tl.fromTo(S.$("drill"), { x: 0 }, { x: 3, duration: 0.05, yoyo: true, repeat: Math.max(0, Math.floor(sc.hostDur / 0.05) - 1), ease: "none" }, 0);
          ["d0", "d1", "d2"].forEach((d) => tl.fromTo(S.$(d), { opacity: 0.8 }, { opacity: 0.08, duration: 1.6, ease: "power1.inOut" }, 0.4));
          // arcs bleus doux depuis le téléphone
          ["r0", "r1", "r2"].forEach((r, i) => {
            L.drawDots(tl, S.$(r), 0.15 + i * 0.15, 0.5, { from: "center" });
            tl.fromTo(S.$(r), { scale: 0.95, svgOrigin: "572 912" }, { scale: 1.06, duration: 1.4, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.7 + i * 0.2);
          });
          L.pill(tl, S, "pRain", w("L34", 0));
          // pluie fine
          tl.fromTo(S.$("rain"), { y: -200, opacity: 0.9 }, { y: 200, duration: 1.5, ease: "none", repeat: Math.floor(sc.hostDur / 1.5) }, 0);
          // « t'apaise » : les yeux se ferment
          L.lids(tl, S, w("L34", 2), 1, 0.5);
          L.shut(tl, S, w("L34", 3), true);

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
