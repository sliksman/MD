<!doctype html>
<!-- GÉNÉRÉ par scripts/sync.mjs depuis src/scenes/02-insomnie.js — éditer la source, pas ce fichier. -->
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="s02" data-width="1080" data-height="1920"></div>
      <script>
        (function () {
          const ID = "s02";
          const L = window.LS;
          const sc = L.scene(ID);
          const A = L.art(ID + "-");
          const root = document.querySelector('[data-composition-id="s02"]');
          const tl = gsap.timeline({ paused: true });
          const w = sc.w;
          // 02 — INSOMNIE. Plongée sur le lit, la lampe s'éteint, 23:04 → 00:04, les yeux s'ouvrent.
          const X = (x) => x * 1.3 - 130, Y = (y) => y * 1.3 - 60; // repère du lit mis à l'échelle
          const world = A.bg() + A.floorIso(1150) +
            `<g transform="translate(-130 -60) scale(1.3)">${A.bedIso({ clock: ["23:04", "23:34", "00:04"] })}</g>` +
            `<rect id="${A.id("dark")}" width="1080" height="1920" fill="#05061a" opacity="0"/>` +
            A.pill("p1h", 220, 560, "+1 h", X(238), Y(697), { dot: L.C.amber }) +
            A.pill("pEyes", 740, 560, "yeux : grands ouverts", X(526), Y(690));
          const S = L.stage(root, ID, world, "");
          L.fadeIn(tl, S, sc);

          // raccord : on finit la bascule commencée en 01
          tl.fromTo(S.tilt, { rotationX: -14, scale: 1.06 }, { rotationX: 0, scale: 1, duration: 0.7, ease: "power2.out" }, 0);
          L.cam(tl, S, { scale: 1 }, { scale: 1.05 }, 0, sc.hostDur, "none");
          // la lampe s'éteint
          tl.fromTo(S.$("lamp"), { opacity: 1 }, { opacity: 0, duration: 0.12 }, 0.45);
          tl.fromTo(S.$("dark"), { opacity: 0 }, { opacity: 0.22, duration: 0.3 }, 0.45);
          // yeux mi-clos (« fatigué »), un clignement
          L.initLids(S, 0.45);
          L.blink(tl, S, w("L02", 1));
          // « une heure » : le réveil défile
          const heure = w("L03", 3);
          tl.set(S.$("clk-0"), { opacity: 0 }, heure - 0.3).set(S.$("clk-1"), { opacity: 1 }, heure - 0.3);
          tl.set(S.$("clk-1"), { opacity: 0 }, heure).set(S.$("clk-2"), { opacity: 1 }, heure);
          L.pill(tl, S, "p1h", heure);
          // « impossible » : les yeux s'ouvrent grand
          const imp = w("L04", 1);
          L.lids(tl, S, imp - 0.05, 0, 0.12);
          tl.fromTo(S.$("eyes-open"), { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.35, duration: 0.25, ease: "back.out(3)" }, imp);
          L.pill(tl, S, "pEyes", imp + 0.1);
          // la couette respire
          tl.fromTo(S.$("duvet"), { scaleY: 1, transformOrigin: "50% 0%" }, { scaleY: 1.012, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
