<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
        #intro-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      </style>
      <div id="root" data-composition-id="intro-title" data-width="1080" data-height="1920"></div>
      <script>
        (function () {
          // Titre de série, au-dessus des scènes 01→02 (évite le dédoublement pendant le fondu).
          const L = window.LS;
          const A = L.art("it-");
          const root = document.querySelector('[data-composition-id="intro-title"]');
          root.innerHTML = '<svg id="intro-svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">' +
            '<defs><filter id="it-fShadow" x="-20%" y="-50%" width="140%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity=".55"/></filter></defs>' +
            A.title("title", "LES NUITS BLANCHES · ÉPISODE 3", ["Pourquoi tu *dors*", "toujours pas ?"], 280) + "</svg>";
          const $ = (n) => root.querySelector("#it-" + n);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo($("title-over"), { opacity: 0, y: -10 }, { opacity: 0.85, y: 0, duration: 0.4, ease: "power2.out" }, 0.05);
          tl.fromTo($("title-l0"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.15);
          tl.fromTo($("title-l1"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.45);
          tl.to($("title"), { opacity: 0, y: -40, duration: 0.6, ease: "power2.in" }, 3.7);
          window.__timelines["intro-title"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
