<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
        #intro-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      </style>
      <div id="root" data-composition-id="intro-title" data-width="1080" data-height="1920"></div>
      <script>
        (function () {
          // Titre de série, au-dessus des scènes 01→02 (évite le dédoublement pendant le fondu).
          const L = window.LS;
          const A = L.art("it-");
          const root = document.querySelector('[data-composition-id="intro-title"]');
          root.innerHTML = '<svg id="intro-svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">' +
            '<defs><filter id="it-fShadow" x="-20%" y="-50%" width="140%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity=".55"/></filter></defs>' +
            A.title("title", "LES NUITS BLANCHES · ÉPISODE 2", ["Pourquoi ton lit", "ne te fait *plus dormir*"], 300, { size: 78, x: 540 }) + "</svg>";
          // bloc justifié : le surtitre prend la largeur de la 1re ligne, la 2e ligne est agrandie pour l'égaler
          (function () { const o = root.querySelector("#it-title-over"), l0 = root.querySelector("#it-title-l0"), l1 = root.querySelector("#it-title-l1");
            o.setAttribute("textLength", "710"); o.setAttribute("lengthAdjust", "spacing"); l0.setAttribute("font-size", "102"); l0.setAttribute("y", "300"); l1.setAttribute("y", "392"); })();
          const $ = (n) => root.querySelector("#it-" + n);
          const tl = gsap.timeline({ paused: true });
          // même entrée que l'épisode 3 : surtitre en fondu, puis chaque ligne tombe avec un rebond
          tl.fromTo($("title-over"), { opacity: 0, y: -10 }, { opacity: 0.85, y: 0, duration: 0.4, ease: "power2.out" }, 0.05);
          tl.fromTo($("title-l0"), { opacity: 0, y: 60, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(2.4)" }, 0.12);
          tl.fromTo($("title-l1"), { opacity: 0, y: 60, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(2.4)" }, 0.36);
          tl.to($("title"), { opacity: 0, y: -40, duration: 0.45, ease: "power2.in" }, 2.0);
          window.__timelines["intro-title"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
