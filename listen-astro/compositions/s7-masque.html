<!doctype html>
<!-- GÉNÉRÉ par scripts/sync.mjs depuis src/scenes/s7-masque.js — éditer la source, pas ce fichier. -->
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="s7" data-width="1080" data-height="1920"></div>
      <script>
        (function () {
          const ID = "s7";
          const L = window.LS;
          const sc = L.scene(ID);
          const A = L.art(ID + "-");
          const root = document.querySelector('[data-composition-id="s7"]');
          const tl = gsap.timeline({ paused: true });
          const w = sc.w;
          // PLAN 7 — « Donc masque sur les yeux, bouchons dans les oreilles. » : gros plan sur son visage. Le masque glisse sur ses yeux, deux bouchons orange se plantent dans les oreilles (« pop »), un égaliseur de bruit s'effondre, le monde s'éteint.
          const bars = [260, 180, 120, 70, 36, 18].map((h, i) => `<g id="${ID}-bar${i}" data-ox="${102 + i * 38}" data-oy="1500"><rect x="${90 + i * 38}" y="${1500 - h}" width="24" height="${h}" rx="6" fill="#7fa6d6" opacity="${0.9 - i * 0.1}"/></g>`).join("");
          const rings = [0, 1].map((s) => `<g id="${ID}-rg${s}" data-ox="${540 + (s ? 1 : -1) * 218}" data-oy="1030" opacity="0"><circle cx="${540 + (s ? 1 : -1) * 218}" cy="1030" r="46" fill="none" stroke="#ff9a3c" stroke-opacity=".7" stroke-width="6"/><circle cx="${540 + (s ? 1 : -1) * 218}" cy="1030" r="82" fill="none" stroke="#ff9a3c" stroke-opacity=".4" stroke-width="4"/></g>`).join("");
          const world = A.wall("w", { sat: 28 }) + `<rect id="${ID}-dm" x="-60" y="-60" width="1200" height="2040" fill="#0a0e26" opacity=".5"/>` + A.sleeper("sl", 540, 1000, 3.4) + rings + bars;
          const S = L.stage(root, ID, world, "");
          gsap.set(S.cam, { svgOrigin: "540 960" });
          const D = sc.end - sc.start, m0 = w("L07", 1) - 0.1, p0 = w("L07", 5) - 0.05;
          gsap.set(S.$("sl-mask"), { opacity: 0, y: -300 });
          gsap.set(S.$("sl-plugs"), { opacity: 0 });
          tl.fromTo(S.$("sl-mask"), { opacity: 0, y: -300 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.6)", immediateRender: false }, m0);
          tl.fromTo(S.$("sl-head"), { scale: 1 }, { scale: 1.02, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, m0 + 0.45);   // la sangle claque
          tl.fromTo(S.$("sl-plugs"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none", immediateRender: false }, p0);
          [0, 1].forEach((s) => tl.fromTo(S.$("rg" + s), { opacity: 1, scale: 0.4 }, { opacity: 0, scale: 1.4, duration: 0.5, ease: "power2.out", immediateRender: false }, p0 + s * 0.08));
          for (let i = 0; i < 6; i++) tl.to(S.$("bar" + i), { scaleY: 0.12, duration: 0.5, ease: "power2.inOut" }, m0 + 0.1 + i * 0.28);
          tl.to(S.$("dm"), { opacity: 0.78, duration: D - (m0 + 0.2), ease: "power1.inOut" }, m0 + 0.2);
          tl.fromTo(S.cam, { scale: 1 }, { scale: 1.06, duration: D, ease: "none", immediateRender: false }, 0);

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
