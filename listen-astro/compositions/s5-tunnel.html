<!doctype html>
<!-- GÉNÉRÉ par scripts/sync.mjs depuis src/scenes/s5-tunnel.js — éditer la source, pas ce fichier. -->
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="s5" data-width="1080" data-height="1920"></div>
      <script>
        (function () {
          const ID = "s5";
          const L = window.LS;
          const sc = L.scene(ID);
          const A = L.art(ID + "-");
          const root = document.querySelector('[data-composition-id="s5"]');
          const tl = gsap.timeline({ paused: true });
          const w = sc.w;
          // PLAN 5 — « Deuxième nouvelle : y'a plein de bruit et plein de lumière dans une station. » : le seul plan large de l'épisode. On avance dans le tunnel de la station ; des ondes de bruit partent des machines, la lumière chaude et la lumière froide se croisent. Badge « 2 ».
          const world = A.tunnel("tn") + A.floaters("fl", 21, 6, 80, 1000, 500, 1500) + `<ellipse cx="540" cy="900" rx="520" ry="760" fill="url(#${ID}-gWarm)" opacity=".5"/><rect id="${ID}-fl2" x="-60" y="-60" width="1200" height="2040" fill="#fff" opacity="0"/>`;
          const S = L.stage(root, ID, world, A.badge("b2", 2));
          gsap.set(S.cam, { svgOrigin: "540 960" });
          const D = sc.end - sc.start, bruit = w("L05", 5), lum = w("L05", 9);
          tl.fromTo(S.$("tn-rg"), { scale: 1 }, { scale: 1.55, duration: D, ease: "power1.in", immediateRender: false }, 0);
          Array.from(S.$("fl").children).forEach((c, i) => tl.fromTo(c, { y: 0, rotation: 0 }, { y: (i % 2 ? -1 : 1) * (60 + i * 14), rotation: (i % 2 ? 1 : -1) * 50, duration: D, ease: "none", immediateRender: false }, 0));
          // les ondes de bruit pulsent sur « bruit »
          ["tn-sn0", "tn-sn1"].forEach((n, k) => { gsap.set(S.$(n), { opacity: 0 }); tl.fromTo(S.$(n), { scale: 0.55, opacity: 0.9 }, { scale: 1.5, opacity: 0, duration: 0.7, ease: "power1.out", repeat: 3, immediateRender: false }, bruit + k * 0.18); });
          // « lumière » : une montée de lumière (douce, jamais de stroboscope)
          tl.fromTo(S.$("fl2"), { opacity: 0 }, { opacity: 0.22, duration: 0.25, ease: "power2.out", immediateRender: false }, lum);
          tl.to(S.$("fl2"), { opacity: 0, duration: 0.7, ease: "power2.inOut" }, lum + 0.25);
          tl.fromTo(S.$("tn-ld"), { opacity: 1 }, { opacity: 0.3, duration: 0.3, yoyo: true, repeat: 9, ease: "none", immediateRender: false }, 0);
          tl.fromTo(S.cam, { scale: 1, rotation: 0 }, { scale: 1.05, rotation: 1.5, duration: D, ease: "none", immediateRender: false }, 0);
          tl.fromTo(S.$("b2"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.6)", immediateRender: false }, w("L05", 0) + 0.04);

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
